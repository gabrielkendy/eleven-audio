<!doctype html>
<html lang="pt-BR" data-tema="papel">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estúdio de Voz Local</title>
    <link rel="stylesheet" href="/web/estilo-v2.css">
  </head>
  <body>
    <div class="estudio">
      <aside class="lateral">
        <div class="marca">
          <span class="marca-simbolo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 14v-4m4 8V6m4 15V3m4 15V6m4 8v-4"/></svg>
          </span>
          <span class="marca-texto"><strong>Estúdio de Voz</strong><small>Processamento local</small></span>
        </div>
        <nav id="navegacao" aria-label="Áreas do estúdio" class="menu"></nav>
        <div class="lateral-rodape">
          <p><a href="/web/audicao.html">Comparar amostras de voz ↗</a></p>
          <p class="selo">Ambiente local</p>
          <p class="lateral-nota">Seus arquivos ficam nesta máquina.</p>
        </div>
      </aside>

      <main class="conteudo">
        <header class="topo">
          <button id="sanfona" class="sanfona" type="button" aria-label="Abrir menu" aria-controls="navegacao" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topo-titulo">
            <h1 id="titulo-area">Gerar áudio</h1>
          </div>
          <div class="topo-status">
            <span class="ponto" id="ponto-base" aria-hidden="true"></span>
            <span id="resumo-status">Consultando o estado da máquina...</span>
          </div>
        </header>
        <div id="areas"></div>
      </main>
    </div>
    <footer id="rodape" class="rodape">Consultando o estado da máquina...</footer>
    <script>window.AREAS = window.AREAS || [];</script>
    <script src="/web/gerar.js" defer></script>
    <script src="/web/clonar.js" defer></script>
    <script src="/web/comparar.js" defer></script>
    <script src="/web/desenhar.js" defer></script>
    <script src="/web/transcrever.js" defer></script>
    <script src="/web/traduzir.js" defer></script>
    <script src="/web/agente.js" defer></script>
    <script src="/web/config.js" defer></script>
    <script src="/web/app.js" defer></script>
  </body>
</html>
